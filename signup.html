<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — REDShop</title><link rel="icon" href="assets/coin.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="frontend/auth.css"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"></head>
<body><header class="site-header"><div class="nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">R<span>.</span></span><span class="brand-name">RED<span>SHOP</span></span></a><nav class="main-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="index.html#how">How it works</a></nav><div class="nav-actions"><a class="nav-login" href="login.html">Log in</a></div></div></header>
<main class="wrap inner-layout"><section class="auth-card"><div class="eyebrow"><span class="eyebrow-line"></span> YOUR NEXT GOOD FIND</div><h1>Make yourself at home.</h1><p>Create an account to keep your coupons close.</p><div class="notice">Google and email sign-in use Firebase Authentication.</div><div class="auth-message" data-auth-message hidden role="alert"></div><button class="button button-google full-width" type="button" data-google-login><span class="google-g">G</span> Continue with Google</button><div class="auth-divider"><span>or use email</span></div><form data-signup-form><div class="form-field"><label for="name">Full name</label><input class="form-control" id="name" name="name" autocomplete="name" placeholder="Your name" required minlength="2"></div><div class="form-field"><label for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="form-field"><label for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required></div><div class="form-field"><label for="confirm">Confirm password</label><input class="form-control" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Enter your password again" minlength="8" required></div><button class="button full-width" type="submit">Create account <span>↗</span></button></form><div class="auth-foot">Already have an account? <a href="login.html">Log in</a></div></section></main>
<footer class="site-footer"><div class="wrap footer-bottom"><span>© 2026 REDShop. Made for good finds.</span><a href="index.html">Back to home ↗</a></div></footer><script type="module" src="frontend/auth.js"></script></body></html>
